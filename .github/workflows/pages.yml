name: Publish Emoji Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node for flag atlas generation
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate color flag sprite sheet
        run: |
          npm install --no-save --ignore-scripts sharp@0.34.4
          node scripts/build-flag-atlas.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Remove all temporary Actions archives after publication
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name, .size_in_bytes] | @tsv' \
            > "${RUNNER_TEMP}/old-artifacts.tsv"
          removed=0
          bytes=0
          while IFS=$'\t' read -r artifact_id artifact_name artifact_size; do
            [[ -n "${artifact_id}" ]] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null
            echo "Deleted ${artifact_name}: ${artifact_size} bytes"
            removed=$((removed + 1))
            bytes=$((bytes + artifact_size))
          done < "${RUNNER_TEMP}/old-artifacts.tsv"
          echo "Deleted ${removed} archived builds, ${bytes} bytes"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name, .size_in_bytes] | @tsv' \
            | tee "${RUNNER_TEMP}/remaining-artifacts.tsv"
          test ! -s "${RUNNER_TEMP}/remaining-artifacts.tsv"
