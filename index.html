<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><meta name="description" content="Большой удобный каталог эмодзи — поиск, категории и копирование в один клик.">
<title>Emoji — список эмодзи для копирования</title>
<style>
:root{font-family:Arial,"Segoe UI Emoji","Apple Color Emoji",sans-serif;color:#24282e;background:#fff;font-synthesis:none}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}button,input{font:inherit}button{cursor:pointer}.top{height:58px;border-bottom:1px solid #e7e9ed;position:sticky;top:0;background:#fffc;backdrop-filter:blur(14px);z-index:10}.topin{max-width:1180px;padding:0 24px;margin:auto;display:flex;align-items:center;justify-content:space-between;height:100%;gap:18px}.logo{font-size:22px;font-weight:800;letter-spacing:-.9px;color:#252932;text-decoration:none}.logo span{color:#fc9955}.topright{font-size:13px;color:#838993}.shell{max-width:1180px;margin:auto;padding:29px 24px 60px}.hero h1{margin:0 0 9px;font-size:30px;letter-spacing:-.9px}.hero p{font-size:14px;color:#747b85;line-height:1.65;margin:0 0 20px}.searchline{display:flex;gap:12px}.searchbox{display:flex;align-items:center;gap:10px;border:1px solid #e1e4e8;border-radius:10px;background:#fafbfc;padding:0 16px;flex:1;transition:border .2s}.searchbox:focus-within{border-color:#f4a16a;box-shadow:0 0 0 3px #ffe9da}.searchbox svg{color:#9098a3;flex-shrink:0}.searchbox input{background:transparent;border:0;outline:0;width:100%;height:48px;font-size:15px;color:inherit}.searchbox input::placeholder{color:#a3a9b0}.clear{border:0;background:#f3f4f6;border-radius:9px;padding:0 15px;color:#6f7681;display:none}.clear.visible{display:block}.nav{display:flex;align-items:center;gap:8px;overflow:auto;padding:19px 0 15px;scrollbar-width:thin}.tab{border:1px solid #e8eaed;background:white;white-space:nowrap;border-radius:9px;min-width:45px;height:42px;font-size:22px;transition:background .16s,border .16s}.tab:hover,.tab.active{background:#fff2e8;border-color:#ffbf92}.count{font-size:12px;color:#969da7;margin:0 0 20px}.group{scroll-margin-top:100px;margin-bottom:24px}.group h2{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-.2px;margin:22px 0 15px}.group h2 .section-icon{font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(61px,1fr));gap:7px}.emoji{height:63px;border-radius:9px;background:#f8f9fa;border:1px solid #f0f1f3;display:grid;place-items:center;font-size:31px;line-height:1;position:relative;transition:transform .1s,background .1s,border-color .1s}.emoji:hover{background:#fff0e5;border-color:#ffbe91;transform:translateY(-2px)}.emoji:focus-visible{outline:2px solid #f39458;outline-offset:2px}.emoji:active{transform:scale(.94)}.empty{padding:60px 20px;text-align:center;color:#7c8490}.empty strong{display:block;color:#30343b;margin:12px 0}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);background:#2a2d33;color:white;padding:12px 18px;border-radius:12px;box-shadow:0 12px 35px #0002;opacity:0;pointer-events:none;transition:.2s;z-index:50;font-size:14px}.toast.show{opacity:1;transform:translate(-50%,0)}.footer{border-top:1px solid #eff0f2;padding:25px 0;margin-top:26px;font-size:12px;text-align:center;color:#9aa0a9}.more{border:1px solid #e7e9ed;background:white;border-radius:8px;padding:8px 14px;font-size:13px;color:#59616b;margin-top:14px}.more:hover{background:#f8f9fa}.hidden{display:none!important}.status{color:#999;font-size:12px}.settings{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-left:auto}.theme{border:1px solid #eee;border-radius:8px;background:transparent;padding:9px}.copyhint{font-size:12px;color:#aaa;margin-left:auto;font-weight:400}@media(max-width:700px){.shell{padding:22px 14px}.topin{padding:0 14px}.hero h1{font-size:24px}.grid{grid-template-columns:repeat(auto-fill,minmax(49px,1fr));gap:5px}.emoji{height:53px;font-size:27px}.tab{min-width:42px;height:40px}.topright,.copyhint{display:none}.group h2{font-size:16px}}@media(min-width:1500px){.shell,.topin{max-width:1300px}.grid{grid-template-columns:repeat(auto-fill,minmax(65px,1fr))}}body.dark{background:#141414;color:#f1f1f1}body.dark .top{background:#161616ee;border-color:#333}body.dark .logo{color:#fff}body.dark .searchbox,body.dark .emoji{background:#222;border-color:#303030}body.dark .tab,body.dark .more{background:#202020;border-color:#333;color:#eee}body.dark .tab:hover,body.dark .tab.active,body.dark .emoji:hover{background:#3b2c23;border-color:#a76c48}body.dark .searchbox input{color:#fff}body.dark .footer{border-color:#333}body.dark .theme{border-color:#333;color:#eee}body.dark .clear{background:#303030;color:#eee}

/* Fast list rendering and a true neutral-black dark theme. */
.theme{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;white-space:nowrap;padding:10px 14px;background:#fff;border-color:#e2e4e8}
.theme:hover{background:#f7f7f8}.theme:focus-visible,.tab:focus-visible,.more:focus-visible{outline:2px solid #ef965a;outline-offset:2px}
.more{display:block;margin:14px auto 4px;padding:11px 18px;min-height:40px}
.group{content-visibility:auto;contain-intrinsic-size:auto 350px}
html.dark{color-scheme:dark;background:#0e0e0e}
html.dark body{background:#0e0e0e;color:#f2f2f2}
html.dark .top{background:#111111ed;border-color:#272727}
html.dark .logo{color:#fff}
html.dark .searchbox{background:#1b1b1b;border-color:#363636}
html.dark .searchbox:focus-within{border-color:#c68455;box-shadow:0 0 0 3px #63381a5a}
html.dark .searchbox input{color:#f5f5f5}
html.dark .searchbox input::placeholder{color:#8f8f8f}
html.dark .hero p,html.dark .count,html.dark .copyhint,html.dark .topright{color:#a0a0a0}
html.dark .emoji{background:#1d1d1d;border-color:#2b2b2b}
html.dark .emoji:hover{background:#33271e;border-color:#ab7b55}
html.dark .tab,html.dark .more,html.dark .theme{background:#1e1e1e;border-color:#343434;color:#ebebeb}
html.dark .tab:hover,html.dark .tab.active,html.dark .more:hover,html.dark .theme:hover{background:#33251c;border-color:#8f6043}
html.dark .clear{background:#292929;color:#e4e4e4}
html.dark .footer{border-color:#2d2d2d}
html.dark .empty strong{color:#fafafa}
@media(max-width:700px){.theme{padding:9px 10px}.theme span{display:none}}


/* Performance-friendly, user-adjustable grid settings */
:root{--emoji-columns:18;--emoji-font:33px;--emoji-cell:62px;--emoji-gap:7px}
.grid{display:grid;grid-template-columns:repeat(var(--emoji-columns),minmax(0,1fr));gap:var(--emoji-gap)}
.emoji{min-width:0;width:100%;height:var(--emoji-cell);font-size:var(--emoji-font)}
.grid-controls{display:flex;align-items:center;flex-wrap:wrap;gap:20px;margin:0 0 16px;padding:13px 18px;border:1px solid #eceef0;border-radius:12px;background:#fafbfc}
.controls-label{font-size:13px;color:#59626d;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:8px}
.control-field{display:flex;align-items:center;gap:12px;flex:1;min-width:190px}
.control-field label{min-width:106px;white-space:nowrap;color:#626975;font-size:13px}
.control-field label output{color:#282d33;font-weight:700}
.control-field input{min-width:80px;flex:1;accent-color:#e88750;cursor:pointer}
.search-results h2{font-size:17px;margin-top:20px}
.section-action{border:1px solid #e5e7e9;background:#fff;border-radius:9px;padding:10px 18px;color:#545b64;font-size:13px;margin-top:14px;min-height:40px}
.section-action:hover{background:#f3f4f6}
.group{content-visibility:auto;contain-intrinsic-size:auto 240px}
.grid-controls:focus-within{border-color:#e6b49c}
html.dark .grid-controls{background:#1b1b1b;border-color:#303030}
html.dark .controls-label,html.dark .control-field label{color:#b8b8b8}
html.dark .control-field label output{color:#f5f5f5}
html.dark .section-action{background:#1f1f1f;border-color:#373737;color:#ebebeb}
html.dark .section-action:hover{background:#303030}
@media(max-width:700px){
.grid-controls{padding:12px;gap:12px}
.controls-label{width:100%}
.control-field{min-width:100%;gap:9px}
.control-field label{min-width:110px}
}

</style>
</head><body>
<header class="top"><div class="topin"><a href="./" class="logo">emoji<span>.</span></a><div class="settings"><span class="topright">Копируй любимые эмодзи одним нажатием</span><button class="theme" id="theme" aria-label="Переключить тему" title="Переключить тему">🌙</button></div></div></header>
<main class="shell"><div class="hero"><h1>Список Emoji 😀</h1><p>Нажми на любой эмодзи, чтобы скопировать его. Выбирай категории или найди нужный символ через поиск.</p><div class="searchline"><label class="searchbox"><svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" type="search" placeholder="Поиск по русскому названию: кот, сердце, машина..." autocomplete="off" aria-label="Поиск эмодзи"></label><button id="clear" class="clear">Очистить</button></div></div>
<nav id="nav" class="nav" aria-label="Категории"></nav><section class="grid-controls" aria-label="Настройки сетки эмодзи">
<div class="controls-label">⚙️ Настройка сетки</div>
<div class="control-field"><label for="columns">Колонки: <output id="columns-value" for="columns">18</output></label><input id="columns" type="range" min="6" max="24" value="18" step="1" aria-label="Количество колонок"></div>
<div class="control-field"><label for="emoji-size">Размер: <output id="size-value" for="emoji-size">33 px</output></label><input id="emoji-size" type="range" min="22" max="50" value="33" step="1" aria-label="Размер эмодзи"></div>
</section><p id="count" class="count">Загрузка эмодзи...</p><div id="content"></div><footer class="footer">Emoji — каталог эмодзи · Нажмите на значок, чтобы скопировать · <button id="reset" class="more">Очистить историю</button></footer></main><div id="toast" class="toast" role="status" aria-live="polite">Скопировано!</div>
<script>

const groups=[{id:'recent',icon:'🕓',name:'Недавно использованные'},{id:'people',icon:'😀',name:'Смайлики и люди'},{id:'nature',icon:'🐶',name:'Животные и природа'},{id:'foods',icon:'🥭',name:'Еда и напитки'},{id:'activity',icon:'⚽',name:'Действия'},{id:'places',icon:'🏖️',name:'Путешествия и места'},{id:'objects',icon:'🕯️',name:'Объекты'},{id:'symbols',icon:'⭕',name:'Символы'},{id:'flags',icon:'🚩',name:'Флаги'}];
const q=id=>document.getElementById(id),historyKey='emoji_history_v1';
const PAGE_SEARCH=64,PAGE_CATEGORY=96,PREVIEW=38,MAX_RECENT=24;
const byCategory=new Map(groups.map(g=>[g.id,[]])),byNative=new Map();
let entries=[],history=[],selected='all',term='',matches=[],shown=0,searchTimer=null,toastTimer=null;
const normalize=t=>String(t||'').trim().toLocaleLowerCase('ru').replaceAll('ё','е').replace(/\s+/g,' ');
const escapeHTML=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const stored=JSON.parse(localStorage.getItem(historyKey)||'[]');history=Array.isArray(stored)?stored.slice(0,MAX_RECENT):[]}catch(e){}
const controls={cols:q('columns'),size:q('emoji-size')};
let cols=Number(localStorage.getItem('emoji_columns'))||18;
let size=Number(localStorage.getItem('emoji_font_size'))||33;
cols=Math.min(24,Math.max(6,cols));size=Math.min(50,Math.max(22,size));
controls.cols.value=cols;controls.size.value=size;
function applyGrid(){
  // On mobile, keep tiles large enough even if a high column count was saved on desktop.
  const width=q('content').clientWidth||window.innerWidth-28;
  const maxFit=Math.max(4,Math.floor((width+7)/(size+17)));
  const effective=Math.min(cols,maxFit);
  document.documentElement.style.setProperty('--emoji-columns',effective);
  document.documentElement.style.setProperty('--emoji-font',size+'px');
  document.documentElement.style.setProperty('--emoji-cell',Math.round(size*1.42+16)+'px');
  q('columns-value').textContent=cols===effective?String(cols):cols+' ('+effective+' на экране)';
  q('size-value').textContent=size+' px';
}
controls.cols.addEventListener('input',e=>{
  cols=Number(e.target.value);localStorage.setItem('emoji_columns',cols);applyGrid();
});
controls.size.addEventListener('input',e=>{
  size=Number(e.target.value);localStorage.setItem('emoji_font_size',size);applyGrid();
});
let pendingResize=false;
window.addEventListener('resize',()=>{
  if(pendingResize)return;
  pendingResize=true;
  requestAnimationFrame(()=>{pendingResize=false;applyGrid()});
},{passive:true});
applyGrid();
const themeButton=q('theme');
let isDark=localStorage.getItem('emoji_theme')==='dark';
function applyTheme(){
  document.documentElement.classList.toggle('dark',isDark);
  document.body.classList.toggle('dark',isDark);
  themeButton.innerHTML=isDark?'☀️ <span>Светлая тема</span>':'🌙 <span>Тёмная тема</span>';
  themeButton.title=isDark?'Включить светлую тему':'Включить тёмную тему';
  themeButton.setAttribute('aria-label',themeButton.title);
  themeButton.setAttribute('aria-pressed',String(isDark));
  document.querySelector('meta[name="theme-color"]').content=isDark?'#0e0e0e':'#ffffff';
}
applyTheme();
themeButton.addEventListener('click',()=>{
  isDark=!isDark;localStorage.setItem('emoji_theme',isDark?'dark':'light');applyTheme();
});
function nav(){
  q('nav').innerHTML=groups.map(g=>'<button type="button" class="tab '+(selected===g.id?'active':'')+'" data-tab="'+g.id+'" aria-pressed="'+(selected===g.id)+'" title="'+g.name+'" aria-label="'+g.name+'">'+g.icon+'</button>').join('');
}
function htmlItem(e){
  const title=escapeHTML(e.name);
  return '<button type="button" class="emoji" title="'+title+' — нажмите, чтобы скопировать" aria-label="Скопировать '+title+'" data-emoji="'+escapeHTML(e.native)+'">'+e.native+'</button>';
}
function recentEntries(){return history.map(n=>byNative.get(n)).filter(Boolean)}
function htmlRecent(){
  const items=recentEntries();
  if(!items.length)return '';
  return '<section class="group" id="recent"><h2><span class="section-icon">🕓</span>Недавно использованные<span class="copyhint">'+items.length+'</span></h2><div class="grid">'+items.map(htmlItem).join('')+'</div></section>';
}
function htmlGroup(g){
  const list=byCategory.get(g.id)||[];
  return '<section class="group" id="'+g.id+'"><h2><span class="section-icon">'+g.icon+'</span>'+g.name+'<span class="copyhint">'+list.length+' эмодзи</span></h2>'+
   '<div class="grid">'+list.slice(0,PREVIEW).map(htmlItem).join('')+'</div>'+
   (list.length>PREVIEW?'<button type="button" class="section-action" data-open="'+g.id+'">Открыть все '+list.length+' эмодзи →</button>':'')+'</section>';
}
const content=q('content'),count=q('count');
function renderAll(){
  selected='all';nav();
  content.innerHTML=htmlRecent()+groups.filter(g=>g.id!=='recent').map(htmlGroup).join('');
  count.textContent=entries.length+' эмодзи · Все названия и поиск на русском';
  applyGrid();
}
function header(g,count){
  return '<h2><span class="section-icon">'+g.icon+'</span>'+g.name+'<span class="copyhint">'+count+' эмодзи</span></h2>';
}
function buildMore(){return shown<matches.length?'<button type="button" class="more" data-more="1">Показать ещё ('+(matches.length-shown)+' осталось)</button>':''}
function renderFocused(g){
  const list=byCategory.get(g.id)||[];
  matches=list;shown=Math.min(PAGE_CATEGORY,matches.length);
  content.innerHTML='<section class="group" id="'+g.id+'">'+header(g,list.length)+'<div class="grid" id="active-grid">'+list.slice(0,shown).map(htmlItem).join('')+'</div><div id="load-more">'+buildMore()+'</div></section>';
  count.textContent=list.length+' эмодзи · '+g.name;
  applyGrid();
}
function runSearch(){
  const value=normalize(q('search').value);
  if(!value){term='';renderAll();return}
  term=value;selected='all';nav();
  const tokens=term.split(' ');
  matches=entries.filter(e=>tokens.every(token=>e.search.includes(token)));
  // Prioritize the Russian name, then translated keywords; retain stable ordering for ties.
  matches.sort((a,b)=>{
    const score=e=>e.native===term?0:e.normalizedName===term?1:e.normalizedName.startsWith(term)?2:e.normalizedName.includes(term)?3:4;
    return score(a)-score(b);
  });
  shown=Math.min(PAGE_SEARCH,matches.length);
  if(!matches.length){
    content.innerHTML='<div class="empty"><div style="font-size:48px">🔎</div><strong>Ничего не найдено</strong>Попробуй другое русское слово.</div>';
  }else{
    content.innerHTML='<section class="group search-results"><h2>🔎 Результаты поиска<span class="copyhint">'+matches.length+' совпадений</span></h2><div id="active-grid" class="grid">'+matches.slice(0,shown).map(htmlItem).join('')+'</div><div id="load-more">'+buildMore()+'</div></section>';
  }
  count.textContent='Найдено: '+matches.length;
  // Grid uses CSS variables; results are capped, keeping input latency low.
  applyGrid();
}
function showMore(){
  const grid=q('active-grid'),more=q('load-more');
  if(!grid||!more||shown>=matches.length)return;
  const next=Math.min(matches.length,shown+(term?PAGE_SEARCH:PAGE_CATEGORY));
  grid.insertAdjacentHTML('beforeend',matches.slice(shown,next).map(htmlItem).join(''));
  shown=next;
  more.innerHTML=buildMore();
}
function openCategory(id){
  const g=groups.find(x=>x.id===id);
  if(!g)return;
  clearTimeout(searchTimer);
  term='';selected=id;
  q('search').value='';
  q('clear').classList.remove('visible');
  nav();
  if(id==='recent'){
    matches=recentEntries();shown=matches.length;
    content.innerHTML=htmlRecent()||'<div class="empty">История пока пуста.</div>';
    count.textContent='Недавно использованные: '+matches.length;
  }else renderFocused(g);
  window.scrollTo({top:0,behavior:'instant'});
}
function updateRecent(){
  if(term||!(selected==='all'||selected==='recent'))return;
  const section=q('recent'),replacement=htmlRecent();
  if(section){if(replacement)section.outerHTML=replacement;else section.remove()}
  else if(selected==='all'&&replacement)content.insertAdjacentHTML('afterbegin',replacement);
  else if(selected==='recent')content.innerHTML=replacement||'<div class="empty">История пока пуста.</div>';
}
function notice(text){
  const toast=q('toast');
  toast.textContent=text;toast.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1700);
}
async function copy(native){
  const item=byNative.get(native);
  let success=false;
  try{
    if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(native);success=true}
  }catch(e){}
  if(!success){
    const field=document.createElement('textarea');
    field.value=native;field.style.cssText='position:fixed;left:-1000px;opacity:0';
    document.body.appendChild(field);field.select();
    try{success=document.execCommand('copy')}catch(e){}
    field.remove();
  }
  if(!success){notice('Не удалось скопировать — проверьте доступ к буферу обмена');return}
  history=[native,...history.filter(x=>x!==native)].slice(0,MAX_RECENT);
  try{localStorage.setItem(historyKey,JSON.stringify(history))}catch(e){}
  notice(native+' · '+(item?.name||'Эмодзи')+' — скопировано!');
  // Never rebuild the search results or the whole emoji catalogue on a copy.
  if(selected==='all'&&!term)requestAnimationFrame(updateRecent);
  else if(selected==='recent')requestAnimationFrame(updateRecent);
}
content.addEventListener('click',e=>{
  const emoji=e.target.closest('[data-emoji]');
  if(emoji){copy(emoji.dataset.emoji);return}
  if(e.target.closest('[data-more]')){showMore();return}
  const button=e.target.closest('[data-open]');
  if(button)openCategory(button.dataset.open);
});
q('nav').addEventListener('click',e=>{
  const btn=e.target.closest('[data-tab]');if(btn)openCategory(btn.dataset.tab);
});
q('search').addEventListener('input',()=>{
  const hasText=!!q('search').value.trim();
  q('clear').classList.toggle('visible',hasText);
  clearTimeout(searchTimer);
  // Only the latest query is ever rendered, after the user finishes a keystroke burst.
  searchTimer=setTimeout(runSearch,175);
});
q('clear').addEventListener('click',()=>{
  clearTimeout(searchTimer);
  q('search').value='';term='';q('clear').classList.remove('visible');
  renderAll();q('search').focus();
});
q('reset').addEventListener('click',()=>{
  history=[];localStorage.removeItem(historyKey);
  if(term)runSearch();else if(selected==='all')renderAll();else if(selected==='recent')openCategory('recent');
  notice('История очищена');
});
fetch('./emoji-data.json').then(r=>{
  if(!r.ok)throw new Error('Ошибка загрузки: '+r.status);return r.json();
}).then(data=>{
  // [category,emoji,russian_name,russian_keywords,english_name,english_keywords]
  entries=data.map(([cat,native,name,ruKeys,enName,enKeys])=>{
    const normalizedName=normalize(name);
    const search=normalize([native,name,ruKeys,enName,enKeys].filter(Boolean).join(' '));
    return {cat,native,name:name.charAt(0).toLocaleUpperCase('ru')+name.slice(1),normalizedName,search};
  });
  for(const entry of entries){
    byCategory.get(entry.cat)?.push(entry);
    byNative.set(entry.native,entry);
  }
  if(q('search').value.trim())runSearch();else renderAll();
}).catch(e=>{
  count.textContent='Не удалось загрузить каталог';
